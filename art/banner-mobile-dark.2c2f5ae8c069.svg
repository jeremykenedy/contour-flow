<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 408" role="img" aria-labelledby="title desc" width="392" height="408">
  <title id="title">Contour Flow</title>
  <desc id="desc">Animated topographic contour lines. No ads, tracking, analytics, or network access.</desc>
  <style>@keyframes contour-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-52}}.flow{stroke-dasharray:8 5;animation:contour-flow 6.5s linear infinite;transform-box:fill-box;transform-origin:center}.flow1{animation-duration:8s;animation-delay:-2s}.flow2{animation-duration:10s;animation-delay:-4s}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#0c0a09" /><stop offset="1" stop-color="#1c1917" /></linearGradient></defs>
  <rect width="392" height="408" rx="16" fill="url(#background)" stroke="#292524" />
  <text x="20" y="76" fill="#fff" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="36" font-weight="700" letter-spacing="-.5">Contour Flow</text>
  <text x="20" y="108" fill="#a8a29e" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5">Animated topographic relief.</text>
  <text x="20" y="126" fill="#a8a29e" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5">No tracking or analytics.</text><g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="500" text-anchor="middle">
    <rect x="20" y="146" width="78" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#a8a29e" stroke-width=".8" /><text x="59.0" y="161" fill="#d6d3d1">Animated</text>
    <rect x="106" y="146" width="72" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#60a5fa" stroke-width=".8" /><text x="142.0" y="161" fill="#60a5fa">Offline</text>
    <rect x="20" y="176" width="91" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#4ade80" stroke-width=".8" /><text x="65.5" y="191" fill="#4ade80">No tracking</text>
    <rect x="119" y="176" width="108" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#fbbf24" stroke-width=".8" /><text x="173.0" y="191" fill="#fbbf24">No analytics</text>
  </g>
  <g transform="translate(70 225) scale(1.1)" fill="none" stroke-linecap="round">
    <path d="M-12 26 C18 5 39 46 68 25 S119 4 148 25 S200 47 231 22" stroke="#1b7689" stroke-width="3" class="flow flow0" />
    <path d="M-12 44 C18 19 43 63 74 43 S124 20 155 43 S203 63 232 40" stroke="#2d9aac" stroke-width="2.5" class="flow flow1" />
    <path d="M-11 63 C21 34 48 82 80 62 S130 39 161 63 S207 84 233 59" stroke="#42c2c0" stroke-width="2" class="flow flow2" />
    <path d="M-10 83 C23 53 52 102 85 81 S135 58 167 82 S211 104 234 78" stroke="#65d9ca" stroke-width="1.8" class="flow flow0" />
    <path d="M-8 103 C25 72 57 121 90 100 S140 77 172 101 S215 123 235 97" stroke="#42c2c0" stroke-width="2" class="flow flow1" />
    <path d="M-5 122 C29 91 62 139 95 119 S147 96 179 120 S219 141 238 116" stroke="#2d9aac" stroke-width="2.4" class="flow flow2" />
  </g>
</svg>
