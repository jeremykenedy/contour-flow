<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">Contour Flow</title>
  <desc id="desc">Animated topographic contour lines. No ads, tracking, analytics, or network access.</desc>
  <rect width="800" height="200" rx="16" fill="#fff" stroke="#e5e7eb"/>
  <text x="40" y="80" fill="#0f172a" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="700" letter-spacing="-.5">Contour Flow</text>
  <text x="42" y="108" fill="#64748b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14">Animated topographic relief. No tracking or analytics of any kind.</text>
